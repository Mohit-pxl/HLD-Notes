    <title>HLD Notes | System Design</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
        }

        .chapter-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .chapter {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 22px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }

        .chapter:hover {
            background: #334155;
            transform: translateY(-3px);
        }

        .number {
            background: #2563eb;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .chapter span:last-child {
            font-size: 16px;
            font-weight: 600;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
