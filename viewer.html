<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HLD Notes | PDF Reader</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
        }

        header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        header a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #pageInfo {
            color: #cbd5e1;
            font-size: 14px;
            min-width: 90px;
            text-align: center;
        }

        /* PDF VIEWER */

        #viewer {
            width: 100%;
            min-height: 85vh;
            padding: 24px 16px 40px;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow: auto;
            background: #0f172a;
        }

        /* PDF CANVAS */

        #pdfCanvas {
            display: block;
            background: #ffffff;

            max-width: none;
            height: auto;

            border-radius: 3px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.35);
        }

        /* LOADING MESSAGE */

        #message {
            text-align: center;
            padding: 35px 15px;
            color: #fbbf24;
        }

        /* MOBILE RESPONSIVENESS */

        @media (max-width: 600px) {

            header {
                padding: 14px 16px;
            }

            header h2 {
                font-size: 17px;
            }

            header a {
                font-size: 12px;
            }

            .toolbar {
                padding: 12px 8px;
                gap: 8px;
            }

            button {
                padding: 9px 11px;
                font-size: 12px;
            }

            #pageInfo {
                font-size: 12px;
                min-width: 75px;
            }

            #viewer {
                padding: 16px 12px 30px;
                min-height: 80vh;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <h2>📚 HLD Notes</h2>

        <a href="index.html">
            ← Back to Chapters
        </a>

    </header>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button id="prev" disabled>
            ← Previous
        </button>

        <span id="pageInfo">
            Page 0 / 0
        </span>

        <button id="next" disabled>
            Next →
        </button>

        <button id="zoomOut">
            −
        </button>

        <button id="zoomIn">
            +
        </button>

        <button id="fullscreen">
            Full Screen
        </button>

    </div>


    <!-- LOADING MESSAGE -->

    <div id="message">
        Loading your notes...
    </div>


    <!-- PDF AREA -->

    <div id="viewer">

        <canvas id="pdfCanvas"></canvas>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // PDF.js configuration

        const pdfjsLib = window['pdfjs-dist/build/pdf'];

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


        // DOM elements

        const canvas = document.getElementById('pdfCanvas');

        const ctx = canvas.getContext('2d');

        const viewer = document.getElementById('viewer');

        const message = document.getElementById('message');


        // Get PDF filename from URL

        const params = new URLSearchParams(
            window.location.search
        );

        const file = params.get('file');


        // Allowed PDF files

        const allowedFiles = [
            '1l.pdf',
            '2l.pdf',
            '3l.pdf',
            '4l.pdf',
            '10l.pdf',
            '11l.pdf',
            '12l.pdf',
            '13l.pdf',
            '15l.pdf',
            '16l.pdf',
            '17l.pdf'
        ];


        // Application state

        let pdfDoc = null;

        let pageNum = 1;

        let zoomLevel = 1;

        let renderTask = null;

        let renderVersion = 0;


        // Calculate responsive scale

        function getResponsiveScale(page) {

            const originalViewport = page.getViewport({
                scale: 1
            });

            const availableWidth =
                viewer.clientWidth - 32;

            const fitScale =
                availableWidth / originalViewport.width;

            return fitScale * zoomLevel;

        }


        // Render PDF page

        async function renderPage(num) {

            if (!pdfDoc) return;

            const currentVersion = ++renderVersion;

            try {

                // Cancel previous rendering if necessary

                if (renderTask) {

                    renderTask.cancel();

                    renderTask = null;

                }

                const page = await pdfDoc.getPage(num);

                if (currentVersion !== renderVersion) return;

                // Responsive scaling

                const scale = getResponsiveScale(page);

                const viewport = page.getViewport({
                    scale: scale
                });

                // High resolution rendering

                const pixelRatio = Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

                canvas.width =
                    Math.floor(viewport.width * pixelRatio);

                canvas.height =
                    Math.floor(viewport.height * pixelRatio);

                canvas.style.width =
                    viewport.width + 'px';

                canvas.style.height =
                    viewport.height + 'px';

                ctx.setTransform(
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0
                );

                // Render page

                renderTask = page.render({

                    canvasContext: ctx,

                    viewport: viewport

                });

                await renderTask.promise;

                if (currentVersion !== renderVersion) return;

                renderTask = null;

                // Update page information

                document.getElementById('pageInfo').textContent =
                    `Page ${num} / ${pdfDoc.numPages}`;

                document.getElementById('prev').disabled =
                    num <= 1;

                document.getElementById('next').disabled =
                    num >= pdfDoc.numPages;

            } catch (error) {

                if (error.name === 'RenderingCancelledException') {
                    return;
                }

                console.error(error);

                message.style.display = 'block';

                message.textContent =
                    'Unable to render this PDF page.';

            }

        }


        // Load PDF

        async function loadPDF() {

            if (!allowedFiles.includes(file)) {

                message.textContent =
                    'Invalid PDF file. Please return to the homepage.';

                return;

            }

            try {

                const loadingTask = pdfjsLib.getDocument(file);

                pdfDoc = await loadingTask.promise;

                message.style.display = 'none';

                pageNum = 1;

                zoomLevel = 1;

                renderPage(pageNum);

            } catch (error) {

                console.error(error);

                message.textContent =
                    'Unable to load PDF. Please check your connection or file name.';

            }

        }


        // Previous page

        document.getElementById('prev')
            .addEventListener('click', () => {

                if (pageNum > 1) {

                    pageNum--;

                    renderPage(pageNum);

                    viewer.scrollTop = 0;

                    viewer.scrollLeft = 0;

                }

            });


        // Next page

        document.getElementById('next')
            .addEventListener('click', () => {

                if (pdfDoc && pageNum < pdfDoc.numPages) {

                    pageNum++;

                    renderPage(pageNum);

                    viewer.scrollTop = 0;

                    viewer.scrollLeft = 0;

                }

            });


        // Zoom in

        document.getElementById('zoomIn')
            .addEventListener('click', () => {

                if (zoomLevel < 2.5) {

                    zoomLevel = Math.min(
                        2.5,
                        zoomLevel + 0.2
                    );

                    renderPage(pageNum);

                }

            });


        // Zoom out

        document.getElementById('zoomOut')
            .addEventListener('click', () => {

                if (zoomLevel > 0.6) {

                    zoomLevel = Math.max(
                        0.6,
                        zoomLevel - 0.2
                    );

                    renderPage(pageNum);

                }

            });


        // Full screen

        document.getElementById('fullscreen')
            .addEventListener('click', async () => {

                try {

                    if (!document.fullscreenElement) {

                        await viewer.requestFullscreen();

                    } else {

                        await document.exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        'Fullscreen unavailable:',
                        error
                    );

                }

            });


        // Re-render when screen size changes

        let resizeTimeout;

        window.addEventListener('resize', () => {

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                if (pdfDoc) {

                    renderPage(pageNum);

                }

            }, 200);

        });


        // Start application

        loadPDF();

    </script>

</body>

</html>
