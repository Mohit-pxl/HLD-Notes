<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0a">
<title>HLD Notes | Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root {
    --bg: #090a0a;
    --surface: #151818;
    --border: #292e2e;
    --text: #f5f5f5;
    --muted: #929999;
    --accent: #facc15;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, Arial, sans-serif;
}

/* HEADER */
header {
    height: 62px;
    padding: 0 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0c0e0e;
    border-bottom: 1px solid var(--border);
}
.logo { font-size: 21px; font-weight: 800; text-decoration: none; color: white; }
.logo span { color: var(--accent); }
.back {
    text-decoration: none;
    color: var(--muted);
    font-size: 13px;
}
.back:hover { color: white; }

/* READER TITLE */
.reader-title {
    padding: 23px 15px 17px;
    text-align: center;
}
.reader-title h1 { font-size: 19px; }
.reader-title p { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* TOOLBAR */
.toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    min-height: 58px;
    padding: 9px 12px;
    background: rgba(21,24,24,.96);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    backdrop-filter: blur(12px);
}
button {
    font: inherit;
    cursor: pointer;
}
.tool {
    background: #202525;
    border: 1px solid #343a3a;
    color: white;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 12px;
}
.tool:hover { background: #303737; }
.tool:disabled { opacity: .35; cursor: not-allowed; }
.page-box {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
}
#pageInput {
    width: 43px;
    padding: 7px 3px;
    text-align: center;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: #090b0b;
    color: white;
    outline: none;
}

/* READING AREA */
#message {
    text-align: center;
    padding: 35px 15px;
    color: var(--muted);
    font-size: 14px;
}
#viewer {
    min-height: 80vh;
    width: 100%;
    padding: 22px 12px 100px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: auto;
    overscroll-behavior: contain;
    background: #090a0a;
}
#pdfCanvas {
    display: block;
    background: white;
    height: auto;
    border-radius: 2px;
    box-shadow: 0 8px 35px rgba(0,0,0,.45);
}

/* FLOATING PAGE CONTROLS */
.floating-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 8px 11px;
    border: 1px solid #343a3a;
    background: rgba(25,29,29,.96);
    border-radius: 40px;
    box-shadow: 0 5px 25px rgba(0,0,0,.4);
}
.floating-nav button {
    width: 39px;
    height: 39px;
    border: none;
    border-radius: 50%;
    background: #303737;
    color: white;
    font-size: 19px;
}
.floating-nav button:disabled { opacity: .3; }
#bottomInfo {
    min-width: 70px;
    text-align: center;
    font-size: 12px;
    color: white;
}

/* FULLSCREEN */
#viewer:fullscreen {
    background: #090a0a;
    padding: 20px;
    align-items: center;
}
#viewer:fullscreen #pdfCanvas {
    max-height: 100%;
}

/* MOBILE */
@media(max-width:600px) {
    header { height: 56px; padding: 0 16px; }
    .logo { font-size: 19px; }
    .back { font-size: 12px; }

    .reader-title { padding: 17px 10px 13px; }
    .reader-title h1 { font-size: 17px; }

    .toolbar { gap: 6px; padding: 9px 5px; }
    .tool { padding: 8px 9px; font-size: 11px; }
    .page-box { font-size: 11px; }
    #pageInput { width: 37px; }

    #viewer { padding: 13px 10px 90px; }

    .floating-nav { bottom: 17px; }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">HLD<span>.</span></a>
    <a href="index.html" class="back">← All Chapters</a>
</header>

<section class="reader-title">
    <h1>HLD Notes Reader</h1>
    <p>Take your time. Understand the concepts.</p>
</section>

<div class="toolbar">
    <button class="tool" id="prev" disabled>← Previous</button>

    <div class="page-box">
        <input type="number" id="pageInput" min="1" value="1">
        <span id="totalPages">/ 0</span>
    </div>

    <button class="tool" id="next" disabled>Next →</button>
    <button class="tool" id="zoomOut">−</button>
    <button class="tool" id="zoomIn">+</button>
    <button class="tool" id="fullscreen">⛶</button>
</div>

<div id="message">Loading your notes...</div>

<div id="viewer">
    <canvas id="pdfCanvas"></canvas>
</div>

<div class="floating-nav">
    <button id="bottomPrev" aria-label="Previous page">←</button>
    <span id="bottomInfo">1 / 0</span>
    <button id="bottomNext" aria-label="Next page">→</button>
</div>

<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const viewer = document.getElementById('viewer');
const message = document.getElementById('message');

const params = new URLSearchParams(location.search);
const file = params.get('file');

const allowedFiles = [
    '1l.pdf','2l.pdf','3l.pdf','4l.pdf',
    '5l.pdf','6l.pdf','7l.pdf','8l.pdf','9l.pdf',
    '10l.pdf','11l.pdf','12l.pdf','13l.pdf',
    '15l.pdf','16l.pdf','17l.pdf'
];

let pdfDoc = null;
let pageNum = 1;
let zoomLevel = 1;
let renderTask = null;
let renderVersion = 0;

function getScale(page) {
    const original = page.getViewport({scale: 1});
    const availableWidth = viewer.clientWidth - 24;
    const fit = Math.min(1.2, availableWidth / original.width);
    return fit * zoomLevel;
}

function updateControls() {
    document.getElementById('pageInput').value = pageNum;
    document.getElementById('pageInput').max = pdfDoc.numPages;

    document.getElementById('totalPages').textContent =
        `/ ${pdfDoc.numPages}`;

    document.getElementById('bottomInfo').textContent =
        `${pageNum} / ${pdfDoc.numPages}`;

    document.getElementById('prev').disabled = pageNum <= 1;
    document.getElementById('bottomPrev').disabled = pageNum <= 1;

    document.getElementById('next').disabled =
        pageNum >= pdfDoc.numPages;

    document.getElementById('bottomNext').disabled =
        pageNum >= pdfDoc.numPages;
}

async function renderPage(number) {
    if (!pdfDoc) return;

    const version = ++renderVersion;

    try {
        if (renderTask) {
            renderTask.cancel();
            renderTask = null;
        }

        const page = await pdfDoc.getPage(number);

        if (version !== renderVersion) return;

        const viewport = page.getViewport({
            scale: getScale(page)
        });

        const pixelRatio = Math.min(
            window.devicePixelRatio || 1, 2
        );

        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);

        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        ctx.setTransform(
            pixelRatio, 0, 0, pixelRatio, 0, 0
        );

        renderTask = page.render({
            canvasContext: ctx,
            viewport
        });

        await renderTask.promise;

        if (version !== renderVersion) return;

        renderTask = null;
        updateControls();
        message.style.display = 'none';

    } catch (error) {
        if (error.name === 'RenderingCancelledException') return;

        console.error(error);
        message.style.display = 'block';
        message.textContent = 'Unable to display this page.';
    }
}

function changePage(number) {
    if (!pdfDoc || number < 1 || number > pdfDoc.numPages) return;

    pageNum = number;
    viewer.scrollTop = 0;
    viewer.scrollLeft = 0;
    renderPage(pageNum);
}

async function loadPDF() {
    if (!allowedFiles.includes(file)) {
        message.textContent = 'Invalid PDF. Return to the chapters page.';
        return;
    }

    try {
        const task = pdfjsLib.getDocument(file);
        pdfDoc = await task.promise;

        pageNum = 1;
        zoomLevel = 1;

        document.getElementById('totalPages').textContent =
            `/ ${pdfDoc.numPages}`;

        renderPage(pageNum);

    } catch (error) {
        console.error(error);
        message.textContent = 'Unable to load PDF. Please try again.';
    }
}

/* BUTTON NAVIGATION */
document.getElementById('prev').onclick =
    () => changePage(pageNum - 1);

document.getElementById('bottomPrev').onclick =
    () => changePage(pageNum - 1);

document.getElementById('next').onclick =
    () => changePage(pageNum + 1);

document.getElementById('bottomNext').onclick =
    () => changePage(pageNum + 1);

/* PAGE JUMP */
document.getElementById('pageInput').addEventListener('change', e => {
    const requested = Number(e.target.value);

    if (
        Number.isInteger(requested) &&
        requested >= 1 &&
        requested <= pdfDoc.numPages
    ) {
        changePage(requested);
    } else {
        e.target.value = pageNum;
    }
});

/* ZOOM */
document.getElementById('zoomIn').onclick = () => {
    if (zoomLevel < 2.5) {
        zoomLevel = Math.min(2.5, zoomLevel + 0.2);
        renderPage(pageNum);
    }
};

document.getElementById('zoomOut').onclick = () => {
    if (zoomLevel > 0.6) {
        zoomLevel = Math.max(0.6, zoomLevel - 0.2);
        renderPage(pageNum);
    }
};

/* KEYBOARD */
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === 'ArrowRight') changePage(pageNum + 1);
    if (e.key === 'ArrowLeft') changePage(pageNum - 1);
});

/* MOBILE SWIPE */
let startX = 0;
let startY = 0;

viewer.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: true});

viewer.addEventListener('touchend', e => {
    if (e.changedTouches.length !== 1 || zoomLevel > 1.05) return;

    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;

    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        if (dx < 0) changePage(pageNum + 1);
        else changePage(pageNum - 1);
    }
}, {passive: true});

/* FULLSCREEN */
document.getElementById('fullscreen').onclick = async () => {
    try {
        if (!document.fullscreenElement) {
            await viewer.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error(error);
    }
};

/* RESIZE */
let resizeTimer;

window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {
        if (pdfDoc) renderPage(pageNum);
    }, 250);
});

loadPDF();
</script>

</body>
</html>
